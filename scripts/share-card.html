<!doctype html>
<!--
  scripts/share-card.html — the 1200 × 630 card for links shared to LINE, Facebook, X
  (public/images/share-card-v2.jpg, set in lib/seo.ts). v2, 2026-10-29: the home page's
  opening in miniature, the hero photograph over a paper line with the name.

  To regenerate: open this file in Chrome at exactly 1200 × 630 (DevTools device toolbar),
  wait for the fonts, and capture a screenshot; or run
    npx playwright screenshot --viewport-size=1200,630 scripts/share-card.html public/images/share-card.png
  then save it as a JPEG (quality ~85) under a new name, and point lib/seo.ts at it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500&family=IBM+Plex+Mono&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid; grid-template-rows: minmax(0, 1fr) auto;
    background: #fbfbfb; color: #111111;
    font-family: Inter, sans-serif;
  }
  .photo { position: relative; overflow: hidden; background: #111111; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 34%; display: block; }
  .strip { display: flex; justify-content: space-between; align-items: flex-end; padding: 22px 48px 26px; }
  .name {
    font-family: Archivo, sans-serif; font-weight: 850; font-variation-settings: "wdth" 62;
    font-size: 104px; line-height: 0.82; letter-spacing: -0.01em; text-transform: uppercase;
  }
  .meta { text-align: right; font-size: 21px; line-height: 1.45; }
  .meta .site { font-family: "IBM Plex Mono", monospace; font-size: 19px; color: rgb(17 17 17 / 0.64); }
</style>
</head>
<body>
  <div class="photo">
    <img src="../public/v2/home/hero.webp" alt="">
  </div>
  <div class="strip">
    <p class="name">Chaiya Katkwao</p>
    <div class="meta">
      <p>Photography, Art, Production, Systems</p>
      <p class="site">chaiyakatkwao.com</p>
    </div>
  </div>
</body>
</html>
